[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-assistant"
version = "0.1.0"
description = "Synthetic data generation and NL querying (Streamlit + PostgreSQL + Vertex AI)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: optional tests that require TEST_DATABASE_URL",
    "integration: needs a real PostgreSQL passed through TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
